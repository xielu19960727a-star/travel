<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>十一云南自驾出行清单</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #87CEEB 0%, #98e4a6 40%, #f9e866 75%, #ffb347 100%);
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 100px;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse 80px 40px at 15% 12%, rgba(255,255,255,0.85) 0%, transparent 100%),
    radial-gradient(ellipse 120px 50px at 25% 10%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(ellipse 90px 35px at 75% 8%, rgba(255,255,255,0.8) 0%, transparent 100%),
    radial-gradient(ellipse 60px 30px at 85% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(ellipse 100px 45px at 50% 6%, rgba(255,255,255,0.75) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: 80px;
  left: 0;
  right: 0;
  height: 200px;
  background:
    radial-gradient(ellipse 300px 180px at 10% 100%, #5b8c5a 0%, transparent 70%),
    radial-gradient(ellipse 400px 200px at 35% 100%, #4a7c59 0%, transparent 70%),
    radial-gradient(ellipse 350px 220px at 60% 100%, #6b9e6a 0%, transparent 70%),
    radial-gradient(ellipse 280px 160px at 85% 100%, #5b8c5a 0%, transparent 70%);
  opacity: 0.25;
  pointer-events: none;
  z-index: 0;
}
.container { max-width: 500px; margin: 0 auto; position: relative; z-index: 1; }
.subtitle {
  text-align: center;
  color: rgba(255,255,255,0.9);
  font-size: 14px;
  margin-bottom: 4px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.15);
  letter-spacing: 2px;
}
h1 {
  text-align: center;
  color: #fff;
  font-size: 26px;
  margin-bottom: 6px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
h1 .car { display: inline-block; animation: bounce 1.5s ease-in-out infinite; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.progress-bar {
  background: rgba(255,255,255,0.25);
  border-radius: 12px;
  height: 22px;
  margin-bottom: 16px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #43e97b, #38f9d7, #ffd700);
  border-radius: 12px;
  transition: width 0.4s ease;
  width: 0%;
}
.progress-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
.category {
  background: #fff;
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.category-header {
  padding: 14px 16px;
  font-size: 17px;
  font-weight: 700;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid #f0f0f0;
}
.category-header .emoji { font-size: 20px; }
.category-header .count {
  margin-left: auto;
  font-size: 13px;
  color: #999;
  font-weight: 400;
}
.item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid #f7f7f7;
  transition: background 0.2s;
}
.item:last-child { border-bottom: none; }
.item.checked { background: #f8fdf9; }
.item.checked .item-name { color: #aaa; text-decoration: line-through; }
.checkbox {
  width: 24px;
  height: 24px;
  border: 2px solid #ddd;
  border-radius: 6px;
  margin-right: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.checkbox.active {
  background: linear-gradient(135deg, #ff9a56, #ff6b6b);
  border-color: #ff9a56;
}
.checkbox.active::after {
  content: '✓';
  color: #fff;
  font-size: 14px;
  font-weight: 700;
}
.item-name {
  flex: 1;
  font-size: 15px;
  color: #333;
  cursor: pointer;
  user-select: none;
}
.note-btn {
  width: 28px;
  height: 28px;
  border: none;
  background: #f0f0f0;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  display: none;
  align-items: center;
  justify-content: center;
  margin-left: 8px;
  flex-shrink: 0;
}
.item.checked .note-btn { display: flex; }
.note-btn.has-note { background: #e8f5e9; }
.note-area {
  display: none;
  padding: 0 16px 10px 52px;
}
.note-area.show { display: block; }
.note-area textarea {
  width: 100%;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  resize: none;
  height: 50px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.note-area textarea:focus { border-color: #ff9a56; }
.save-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  background: #fff;
  box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
  display: flex;
  justify-content: center;
  gap: 12px;
  z-index: 100;
}
.save-btn {
  padding: 12px 40px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.save-btn.primary {
  background: linear-gradient(135deg, #ff9a56, #ff6b6b);
  color: #fff;
  box-shadow: 0 4px 12px rgba(255,107,107,0.4);
}
.save-btn.primary:active { transform: scale(0.96); }
.save-btn.secondary {
  background: #f5f5f5;
  color: #666;
}
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(0,0,0,0.75);
  color: #fff;
  padding: 14px 28px;
  border-radius: 10px;
  font-size: 15px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<div class="container">
  <div class="subtitle">🚗 云南自驾之旅</div>
  <h1><span class="car">🧳</span> 十一出行旅游清单</h1>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
    <div class="progress-text" id="progressText">0 / 0</div>
  </div>
  <div id="checklist"></div>
</div>

<div class="save-bar">
  <button class="save-btn secondary" onclick="resetAll()">重置</button>
  <button class="save-btn primary" onclick="saveData()">💾 保存</button>
</div>

<div class="toast" id="toast"></div>

<script>
const DATA = [
  { emoji: '🔌', name: '电子类', items: [
    '充电头 * 3', '充电线 * 3', '充电宝 * 3', 'ipad mini', '手机支架', '自拍杆', '相机及其配件'
  ]},
  { emoji: '🧺', name: '生活类', items: [
    '雨衣', '雨伞', '野餐桌', '凳子 * 2', '折叠水壶', '水杯 * 1',
    '大保温杯 * 1', '水桶 * 1（700ml）', '餐巾纸 * 10', '便携纸巾 * 10', '纸巾', '牙线',
    '头绳 * 4', '塑料袋', '垃圾袋 * 1 卷', '湿巾 * 1 包'
  ]},
  { emoji: '💄', name: '化妆类', items: [
    '防晒', '化妆品', '唇膏'
  ]},
  { emoji: '🧴', name: '个人用品类', items: [
    '隐形眼镜', '睡衣 * 1 套', '内衣 * 2 套', '内裤 * 7 套', '服装4 套（长款3，短款 * 1）',
    '拖鞋 * 1 双', '定型喷雾', '夹板', '马丁靴 * 2 双', '药膏', '药贴', '耳塞', '口罩', '花露水', '背带'
  ]},
  { emoji: '🐶', name: '宠物类', items: [
    '狗粮 700g', '软骨素 * 1 袋', '狗绳', '嘴罩', '尿片 * 7 片', '水碗', '宠物湿巾', '驱虫喷雾', '狗狗毛巾', '零食 * 1 袋'
  ]},
  { emoji: '🩹', name: '急救医用袋', items: [
    '止血贴', '酒精', '健胃消食片', '肠炎宁片', '布洛芬'
  ]}
];

const STORAGE_KEY = 'travel_checklist_2026';
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {};
}

function getItemKey(catIdx, itemIdx) {
  return catIdx + '_' + itemIdx;
}

function render() {
  const container = document.getElementById('checklist');
  container.innerHTML = '';
  let totalItems = 0;
  let checkedItems = 0;

  DATA.forEach((cat, catIdx) => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';

    let catChecked = 0;
    cat.items.forEach((_, itemIdx) => {
      const key = getItemKey(catIdx, itemIdx);
      if (state[key] && state[key].checked) catChecked++;
    });

    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = '<span class="emoji">' + cat.emoji + '</span><span>' + cat.name + '</span><span class="count">' + catChecked + ' / ' + cat.items.length + '</span>';
    catDiv.appendChild(header);

    cat.items.forEach((itemName, itemIdx) => {
      totalItems++;
      const key = getItemKey(catIdx, itemIdx);
      const itemState = state[key] || {};
      const isChecked = !!itemState.checked;
      const note = itemState.note || '';
      if (isChecked) checkedItems++;

      const itemDiv = document.createElement('div');
      itemDiv.className = 'item' + (isChecked ? ' checked' : '');
      itemDiv.id = 'item_' + key;

      const cb = document.createElement('div');
      cb.className = 'checkbox' + (isChecked ? ' active' : '');
      cb.onclick = function() { toggleItem(key, catIdx, itemIdx); };

      const nameSpan = document.createElement('div');
      nameSpan.className = 'item-name';
      nameSpan.textContent = itemName;
      nameSpan.onclick = function() { toggleItem(key, catIdx, itemIdx); };

      const noteBtn = document.createElement('button');
      noteBtn.className = 'note-btn' + (note ? ' has-note' : '');
      noteBtn.textContent = note ? '📝' : '💬';
      noteBtn.onclick = function(e) { e.stopPropagation(); toggleNote(key); };

      itemDiv.appendChild(cb);
      itemDiv.appendChild(nameSpan);
      itemDiv.appendChild(noteBtn);
      catDiv.appendChild(itemDiv);

      const noteArea = document.createElement('div');
      noteArea.className = 'note-area' + (isChecked && note ? ' show' : '');
      noteArea.id = 'note_' + key;
      const textarea = document.createElement('textarea');
      textarea.placeholder = '输入备注...';
      textarea.value = note;
      textarea.oninput = function() {
        if (!state[key]) state[key] = {};
        state[key].note = this.value;
        if (this.value) {
          noteBtn.classList.add('has-note');
          noteBtn.textContent = '📝';
        } else {
          noteBtn.classList.remove('has-note');
          noteBtn.textContent = '💬';
        }
      };
      noteArea.appendChild(textarea);
      catDiv.appendChild(noteArea);
    });

    container.appendChild(catDiv);
  });

  const pct = totalItems > 0 ? Math.round(checkedItems / totalItems * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = checkedItems + ' / ' + totalItems + ' (' + pct + '%)';
}

function toggleItem(key, catIdx, itemIdx) {
  if (!state[key]) state[key] = { checked: false, note: '' };
  state[key].checked = !state[key].checked;
  render();
}

function toggleNote(key) {
  const noteArea = document.getElementById('note_' + key);
  if (noteArea) noteArea.classList.toggle('show');
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  showToast('✅ 已保存！');
}

function resetAll() {
  if (confirm('确定要重置所有勾选和备注吗？')) {
    state = {};
    localStorage.removeItem(STORAGE_KEY);
    render();
    showToast('已重置');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

render();
</script>
</body>
</html>
